name: Web-Sentinel CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Python Syntax
      run: |
        python3 -m py_compile sentinel.py
        python3 -m py_compile core/*.py
        python3 -m py_compile modules/*.py

    - name: Test Help & Argument Parsing
      run: |
        python3 sentinel.py --help

    - name: Test Template Engine & Reporting
      run: |
        python3 sentinel.py -t example.com -m 6
